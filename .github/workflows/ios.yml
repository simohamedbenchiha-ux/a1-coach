# Appli iOS : vérifie à chaque modification que le projet compile (simulateur, sans signature).
# Envoi vers TestFlight / App Store : lancer à la main (« Run workflow ») une fois les secrets App Store
# Connect enregistrés (voir STORE.md). La signature est gérée par Apple (signature automatique via la clé API).
name: iOS

on:
  push:
    branches: [main]
    paths: [src/**, index.html, vendor/**, ios/**, scripts/build-app.mjs, package.json, package-lock.json, capacitor.config.json, .github/workflows/ios.yml]
  workflow_dispatch:
    inputs:
      testflight:
        description: "Envoyer sur TestFlight (secrets App Store Connect requis)"
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash   # active pipefail : un échec dans « commande | tail » fait échouer l'étape

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Dépendances et projet iOS
        run: |
          npm ci
          node scripts/build-app.mjs
          npx cap sync ios
      - name: Compilation (simulateur, sans signature)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO build | tail -n 30
      - name: Contrôles Apple (manifeste de confidentialité, permissions)
        run: |
          APP="$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/App.app"
          # sans PrivacyInfo.xcprivacy, App Store Connect refuse l'envoi (ITMS-91053)
          plutil -lint "$APP/PrivacyInfo.xcprivacy"
          for k in NSMicrophoneUsageDescription NSSpeechRecognitionUsageDescription; do
            /usr/libexec/PlistBuddy -c "Print :$k" "$APP/Info.plist" > /dev/null || { echo "::error::$k manquant dans Info.plist"; exit 1; }
          done
          echo "Manifeste de confidentialité et textes de permission présents"

      - name: Archive signée et envoi sur TestFlight
        if: inputs.testflight
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey.p8"; printf '%s' "$ASC_KEY_P8" > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          VERSION=$(node -p "require('./package.json').version")
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            "${AUTH[@]}" archive | tail -n 30
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}" | tail -n 30
